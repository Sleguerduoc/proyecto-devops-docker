services:

  mysql-db:
    image: mysql:8
    container_name: mysql-container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - app-network

  backend-ventas:
    build:
      context: ./back-Ventas_SpringBoot/Springboot-API-REST

    container_name: backend-ventas

    restart: always

    ports:
      - "8080:8080"

    environment:
      DB_ENDPOINT: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      mysql-db:
        condition: service_healthy

    networks:
      - app-network

  backend-despachos:
    build:
      context: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

    container_name: backend-despachos

    restart: always

    ports:
      - "8081:8080"

    environment:
      DB_ENDPOINT: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

    depends_on:
      mysql-db:
        condition: service_healthy

    networks:
      - app-network

  frontend:
    build:
      context: ./front_despacho

    container_name: frontend

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend-ventas
      - backend-despachos

    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
